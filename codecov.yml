codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "95...100"

  status:
    project:
      default:
        target: 95%
        threshold: 0%
    patch:
      default:
        target: 95%

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
