codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    # Fail a PR only when it lowers overall coverage versus its base.
    project:
      default:
        target: auto
        threshold: 0%
    # Report coverage of changed lines without blocking the PR.
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
