<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FalkorDB Browser</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0e0e10;
            color: #f2f2f2;
            text-align: center;
        }
        code { background: #ffffff1a; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>FalkorDB Browser</h1>
        <p>This build has no server configured.</p>
        <p>Rebuild with <code>FALKORDB_BROWSER_URL=https://…</code> set, then run <code>npx cap sync</code>.</p>
    </main>
</body>
</html>
