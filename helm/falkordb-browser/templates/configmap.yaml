apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "falkordb-browser.fullname" . }}
  labels:
    {{- include "falkordb-browser.labels" . | nindent 4 }}
data:
  CHAT_URL: {{ .Values.env.chatUrl | quote }}
  NEXTAUTH_URL: {{ .Values.env.nextauthUrl | quote }}
  NEXT_PUBLIC_GOOGLE_ANALYTICS: {{ .Values.env.googleAnalytics | quote }}
  PORT: {{ .Values.env.port | quote }}
  REST_PORT: {{ .Values.env.restPort | quote }}
  CYPHER: {{ .Values.env.cypher | quote }}
  HOSTNAME: {{ .Values.env.hostname | quote }}
  API_TOKEN_STORAGE_PATH: {{ .Values.env.apiTokenStoragePath | quote }}
{{- if .Values.connection.enabled }}
  {{- /* Only non-empty fields are emitted: an empty value would override the url. */}}
  FALKORDB_AUTO_CONNECT: {{ .Values.connection.autoConnect | quote }}
  {{- with .Values.connection.host }}
  FALKORDB_HOST: {{ . | quote }}
  {{- end }}
  {{- if ne (toString .Values.connection.port) "" }}
  FALKORDB_PORT: {{ .Values.connection.port | quote }}
  {{- end }}
  {{- with .Values.connection.username }}
  FALKORDB_USERNAME: {{ . | quote }}
  {{- end }}
  {{- if ne (toString .Values.connection.tls) "" }}
  FALKORDB_TLS: {{ .Values.connection.tls | quote }}
  {{- end }}
{{- end }}
