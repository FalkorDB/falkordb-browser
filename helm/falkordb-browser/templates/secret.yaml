apiVersion: v1
kind: Secret
metadata:
  name: {{ include "falkordb-browser.fullname" . }}
  labels:
    {{- include "falkordb-browser.labels" . | nindent 4 }}
{{ include "falkordb-browser.validateEncryptionKeySecret" . }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ include "falkordb-browser.nextauthSecret" . | quote }}
  {{- if not .Values.encryption.existingSecret.name }}
  ENCRYPTION_KEY: {{ include "falkordb-browser.encryptionKey" . | quote }}
  {{- end }}
{{- if .Values.connection.enabled }}
  {{- $external := .Values.connection.existingSecret }}
  {{- $externalName := $external.name | default "" }}
  {{- /*
    Skipped when the value is empty, or when connection.existingSecret supplies
    it. A key WITHOUT a Secret name is not usable, and falkordb-browser.connectionSecretEnv
    then falls back to this Secret — so the chart-managed value has to stay.
    Emptiness is decided on the trimmed value, as falkordb-browser.connectionSecretEnv
    does, but the value itself is stored verbatim: a password may legitimately
    start or end with a space.
  */}}
  {{- if and (.Values.connection.url | default "" | toString | trim) (not (and $externalName $external.urlKey)) }}
  FALKORDB_CONNECTION_URL: {{ .Values.connection.url | quote }}
  {{- end }}
  {{- if and (.Values.connection.password | default "" | toString | trim) (not (and $externalName $external.passwordKey)) }}
  FALKORDB_PASSWORD: {{ .Values.connection.password | quote }}
  {{- end }}
  {{- if and (.Values.connection.ca | default "" | toString | trim) (not (and $externalName $external.caKey)) }}
  FALKORDB_CA: {{ .Values.connection.ca | quote }}
  {{- end }}
{{- end }}
