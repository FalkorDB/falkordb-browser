# Default values for falkordb-browser.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: docker.io
  repository: falkordb/falkordb-browser
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

global:
  imageRegistry: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

encryption:
  # Server-side encryption key for stored credentials and tokens.
  # Precedence is: existingSecret.name, then key, then a generated key. Set only
  # one of existingSecret.name or key. Generated keys are reused from the release
  # Secret on upgrades.
  # Must be 64 hexadecimal characters (32 bytes).
  # You can generate one with: openssl rand -hex 32
  key: ""
  # Use an existing Secret in the release namespace for ENCRYPTION_KEY instead
  # of setting encryption.key or generating a key in the chart Secret.
  existingSecret:
    name: ""
    key: "ENCRYPTION_KEY"

# A single FalkorDB connection supplied by the operator, so the browser starts
# already connected instead of asking every user to fill in the login form.
# This is the GitOps path: the connection lives in Git (and its password in a
# Secret) rather than in each user's browser.
#
# SECURITY: with autoConnect enabled and a password supplied, anyone who can
# reach the browser reaches the database with it. Only enable that where the
# browser is already protected (private network, ingress auth, VPN). Leave the
# password empty to have users supply it themselves on a prefilled form.
connection:
  enabled: false
  # Either set url, or the discrete fields below. Discrete fields win over the
  # url, so a single field can be overridden without rewriting the url.
  # Example: "falkors://default:password@falkordb-master.falkordb.svc:6379"
  url: ""
  host: ""
  # Left empty to fall back to the url, then to 6379.
  port: ""
  # Left empty to fall back to the url, then to "default".
  username: ""
  # Password. Deliberately has no default: an empty one would be indistinguishable
  # from "not set", and the chart must not emit an empty FALKORDB_PASSWORD (it
  # would override the password carried by the url). Set it with
  # `--set connection.password=…`, an override file, or existingSecret below.
  # password:
  # "true" / "false", or empty to take TLS from the url scheme (falkors/rediss).
  tls: ""
  # Base64-encoded CA certificate; needed only for a private TLS CA.
  ca: ""
  # Log in automatically on page load. Set to false to only prefill the form.
  autoConnect: true
  # Read the secret parts from an existing Secret instead of from values.yaml.
  # Each key is optional; an unset key falls back to the value above.
  existingSecret:
    name: ""
    urlKey: ""
    passwordKey: ""
    caKey: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  # readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  # Additional port for text-to-cypher REST API
  restPort: 8080
  # Session affinity for sticky sessions (uncomment to enable)
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800  # 3 hours

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # 
    # Sticky sessions for NGINX Ingress:
    # nginx.ingress.kubernetes.io/affinity: "cookie"
    # nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    # nginx.ingress.kubernetes.io/session-cookie-name: "falkordb-browser-session"
    # nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    # nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    # 
    # Sticky sessions for Traefik:
    # traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    # traefik.ingress.kubernetes.io/service.sticky.cookie.name: "falkordb-browser-session"
  hosts:
    - host: falkordb-browser.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: falkordb-browser-tls
  #    hosts:
  #      - falkordb-browser.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for the FalkorDB Browser
env:
  # URL for the chat/text-to-cypher service (REST API)
  chatUrl: "http://localhost:8080/"
  # Base URL for the browser (should match your ingress/service URL)
  nextauthUrl: "http://localhost:3000/"
  # Secret for NextAuth.js authentication
  # WARNING: This MUST be changed in production! Generate a secure random string.
  # You can generate one with: openssl rand -base64 32
  # IMPORTANT: Do not use the default value in production environments!
  nextauthSecret: "CHANGE_ME_IN_PRODUCTION"
  # Google Analytics ID (optional)
  googleAnalytics: ""
  # Main browser port
  port: "3000"
  # Text-to-cypher REST API port
  restPort: "8080"
  # Enable/disable text-to-cypher feature (1 = enabled, 0 = disabled)
  cypher: "1"
  # Hostname binding
  hostname: "0.0.0.0"
  # API token storage path (for persistent volume if needed)
  apiTokenStoragePath: ".data/api_tokens.json"

# Persistent volume for API tokens and other data
persistence:
  enabled: false
  # storageClass: "-"
  accessMode: ReadWriteOnce
  size: 1Gi
  # existingClaim: ""
  mountPath: /app/.data
