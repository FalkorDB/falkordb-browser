name: Polish release notes

permissions:
  contents: read

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rewrite (e.g. v2.6.2)'
        required: true
      dry_run:
        description: 'Print the new notes without updating the release'
        type: boolean
        default: false

concurrency:
  group: release-notes-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          # A release event checks out the release's tag by default, which may
          # predate this script; run the default branch's copy instead.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      # Installed outside the repo so the project's own dependencies aren't pulled in,
      # from the committed lockfile and without install scripts, so the dependency
      # tree can't change unreviewed in a job that holds a release-write token.
      - name: Install OpenAI SDK
        run: |
          cp .github/scripts/polish-release-notes.mjs .github/scripts/package.json .github/scripts/package-lock.json "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Rewrite release notes
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node "$RUNNER_TEMP/polish-release-notes.mjs"
