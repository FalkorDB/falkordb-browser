name: Polish release notes

# Runs FalkorDB's shared release-notes workflow; its header explains what it
# does and what it needs (the AZURE_OPENAI_API_KEY secret and the
# AZURE_OPENAI_ENDPOINT variable, set on the organization). It follows main,
# so changes merged there apply here on the next release.

permissions:
  contents: read

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rewrite (e.g. v2.6.2), or the newest one of a range'
        required: true
      from_tag:
        description: 'Oldest release tag of a range (e.g. v2.4.0); every published release from it through tag is rewritten. Leave empty for tag alone.'
        required: false
        default: ''
      dry_run:
        description: 'Print the new notes without updating the release'
        type: boolean
        default: false

jobs:
  polish:
    permissions:
      contents: write       # edit the release
      pull-requests: read   # read the PRs it lists
      id-token: write       # lets the shared workflow find its own commit
    uses: FalkorDB/.github/.github/workflows/release-notes.yml@main
    with:
      product: FalkorDB Browser
      product-description: a web UI for exploring and querying FalkorDB graph databases
      # The browser shows this section to users after they upgrade (lib/releaseNotes.ts).
      whats-new: true
      tag: ${{ inputs.tag }}
      from-tag: ${{ inputs.from_tag }}
      dry-run: ${{ inputs.dry_run || false }}
    secrets:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
