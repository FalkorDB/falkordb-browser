name: Coverage status

# The coverage gate. Each time a workflow that uploads coverage starts or
# finishes, this posts coverage/project and coverage/patch to its commit (branch protection
# requires both): pending until every coverage workflow the commit triggers
# has finished and Codecov has processed their uploads, then a pass or a
# fail against the target. .github/scripts/coverage-gate.mjs has the details.
# Once the gate has posted, it tells Codecov to post its pull request comment
# (codecov.yml: notify.manual_trigger).
#
# workflow_run runs this file and the gate script from the default branch,
# with a token that can post statuses, for pull requests from forks and
# Dependabot too. It never checks out or runs the pull request's code.

on:
  workflow_run:
    workflows: ["Build", "Playwright Tests", "Desktop app", "Mobile app"]
    # requested: a new run or a re-run puts the gate back to pending at once,
    # rather than leave an earlier verdict up until the run is done.
    types: [requested, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  # The latest event of a commit's trigger decides: an earlier run is
  # superseded. A push and a pull request of one commit are gated apart.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Post the coverage gate
        id: gate
        run: node .github/scripts/coverage-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          TARGET: "95"

      - name: Tell Codecov to post its comment
        if: steps.gate.outputs.decided == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          override_commit: ${{ github.event.workflow_run.head_sha }}
