name: Coverage status

# The coverage gate. Each time a workflow that uploads coverage starts or
# finishes, this posts coverage/project and coverage/patch to its pull
# request's head commit (branch protection requires both), or
# coverage/project (push) to a commit pushed to main or staging: pending
# until every coverage workflow the commit triggers has finished and Codecov
# has processed their uploads, then a pass or a fail against the target.
# .github/scripts/coverage-gate.mjs has the details.
# Once the gate has posted, it tells Codecov to post its pull request comment
# (codecov.yml: notify.manual_trigger).
#
# A pull request's workflows test it merged into its base, so once it moves
# to another base its coverage is stale, and no workflow reruns by itself:
# the gate then fails both statuses until a push or a reopen tests it again
# (pull_request_target, edited).
#
# Both events run this file in the repository's own context, with a token
# that can post statuses, for pull requests from forks and Dependabot too.
# The gate script is the default branch's; it never checks out or runs the
# pull request's code.

on:
  workflow_run:
    workflows: ["Build", "Playwright Tests", "Desktop app", "Mobile app"]
    # requested and in_progress (a re-run sends no requested): a new run or
    # a re-run puts the gate back to pending at once, rather than leave an
    # earlier verdict up until the run is done.
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [edited]
    branches: [main, staging]

permissions:
  contents: read
  actions: read
  pull-requests: read
  # A pull request's timeline, for when it last moved to another base.
  issues: read
  statuses: write

concurrency:
  # The latest event of a commit's trigger decides: an earlier run is
  # superseded. A push and a pull request of one commit are gated apart.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event || 'pull_request' }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  gate:
    # An edit that is not a move to another base (a title, a description) changes nothing.
    if: github.event_name == 'workflow_run' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Post the coverage gate
        id: gate
        run: node .github/scripts/coverage-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          EVENT: ${{ github.event.workflow_run.event || 'pull_request' }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login || github.event.pull_request.head.repo.owner.login }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          TARGET: "95"

      - name: Tell Codecov to post its comment
        if: steps.gate.outputs.decided == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          override_commit: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
