name: Coverage status

# Codecov holds codecov/project and codecov/patch for a commit until this
# workflow says every upload is in (codecov.yml: notify.manual_trigger).
# Otherwise it would post them after the first upload, from that one and the
# other flags carried forward from an earlier commit, before the e2e tests
# have run.
#
# It runs each time a workflow that uploads coverage finishes, and tells
# Codecov to post once none of them is still running for the commit. A
# workflow that a commit's paths skip never starts, so it is not waited for.
# A re-run posts again with what it adds.
#
# workflow_run runs the workflow file from the default branch, with this
# repository's secrets, for pull requests from forks as well.

on:
  workflow_run:
    workflows: ["Build", "Playwright Tests", "Desktop app", "Mobile app"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check every coverage workflow of the commit has finished
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          running=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" --jq '
            [.workflow_runs[]
             | select(.name == "Build" or .name == "Playwright Tests" or .name == "Desktop app" or .name == "Mobile app")
             | select(.status != "completed")
             | .name] | unique | join(", ")')
          if [ -n "$running" ]; then
            echo "Still running for $SHA: $running"
          else
            echo "Every coverage workflow of $SHA has finished"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      # The Codecov CLI reads the repository from the checkout's remote.
      - name: Checkout
        if: steps.runs.outputs.done == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tell Codecov to post the coverage statuses
        if: steps.runs.outputs.done == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          override_commit: ${{ github.event.workflow_run.head_sha }}
          fail_ci_if_error: true
