name: Mobile app

# Lints the AWS template and builds a debug Android APK of the Capacitor shell.
# It publishes nothing and deploys nothing, and runs only when mobile/ changes
# or on demand, so the existing workflows are unaffected.

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aws-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint CloudFormation template
        run: pipx run cfn-lint mobile/aws/browser-service.yml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set the repository variable to the deployed browser's URL; the
      # placeholder still proves the shell builds.
      FALKORDB_BROWSER_URL: ${{ vars.FALKORDB_BROWSER_URL || 'https://browser.example.com' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --no-audit --progress=false

      - name: Add or sync the Android project
        run: |
          if [ -d android ]; then npx cap sync android; else npx cap add android; fi

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: falkordb-browser-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
