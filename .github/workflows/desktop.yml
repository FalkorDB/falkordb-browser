name: Desktop app

# Builds the Electron app on every OS. On pull requests, pushes and manual runs
# the installers are only uploaded as workflow artifacts. When a GitHub release
# is published, they are also attached to that release, so its page lists a
# download for each OS. The release notes, the Docker image release and the
# Helm chart are left alone.

on:
  release:
    types: [published]
  push:
    branches: ["main", "staging"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      # The web app the installers bundle (`npm run dist` builds it).
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "types/**"
      - "auth.ts"
      - "proxy.ts"
      - "next.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      # The web app the installers bundle (`npm run dist` builds it).
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "types/**"
      - "auth.ts"
      - "proxy.ts"
      - "next.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (mac-arm64), macos-15-intel builds for
        # Intel Macs (mac-x64). Each runner builds its own architecture natively.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Only the macOS release packaging step enables signing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --progress=false

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --progress=false

      - name: Lint desktop
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npm run lint

      - name: Run desktop tests
        working-directory: desktop
        run: npm test
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage/raw/desktop

      # Stamp the app with the release's version (v2.6.1 -> 2.6.1), not the
      # one last written into desktop/package.json. Keep release asset names
      # stable because the GitHub release notes link to these files.
      - name: Use the release version
        if: github.event_name == 'release'
        working-directory: desktop
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Verify macOS signing credentials
        if: runner.os == 'macOS' && github.event_name == 'release'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] ||
             [ -z "$MACOS_CERTIFICATE_PASSWORD" ] ||
             [ -z "$APPLE_ID" ] ||
             [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] ||
             [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Configure all documented macOS signing and notarization secrets before publishing a desktop release."
            exit 1
          fi

      # Native modules in the standalone server are traced for the OS that
      # builds them, which is why each platform builds its own installer.
      - name: Build bundled server
        working-directory: desktop
        run: npm run build:web && npm run prepare:server

      - name: Build unsigned installers
        if: runner.os != 'macOS' || github.event_name != 'release'
        working-directory: desktop
        run: npx --no-install electron-builder --publish never

      - name: Build signed macOS installers
        if: runner.os == 'macOS' && github.event_name == 'release'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Apple credentials trigger notarization; stapler validation below
        # enforces that notarization actually completed.
        run: npx --no-install electron-builder --publish never -c.mac.forceCodeSigning=true

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && github.event_name == 'release'
        working-directory: desktop/dist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(mac*/*.app)
          dmgs=(*.dmg)
          if [ ${#apps[@]} -eq 0 ] || [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No macOS app bundle or DMG was built."
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falkordb-browser-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # Last, so a Codecov problem never skips the installers; and never for a
      # release, whose attach-to-release job needs this one to pass (its commit
      # was measured when it was pushed).
      - name: Build the desktop coverage report
        if: ${{ !cancelled() && runner.os == 'Linux' && github.event_name != 'release' }}
        run: node .github/scripts/coverage-report.mjs desktop coverage/raw/desktop

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && runner.os == 'Linux' && github.event_name != 'release' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/desktop/codecov.json
          disable_search: true
          flags: desktop
          name: desktop
          # A failed upload (no token on Dependabot's runs, a Codecov outage)
          # does not fail the tests: coverage-gate.mjs fails the coverage
          # statuses on any missing upload instead.
          fail_ci_if_error: false
      - name: Keep the coverage report
        if: ${{ !cancelled() && runner.os == 'Linux' && github.event_name != 'release' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-desktop
          path: coverage/desktop/
          retention-days: 3
          if-no-files-found: ignore
          overwrite: true

  # Runs even when some platforms fail, so a missing macOS credential does not
  # hold back the Windows and Linux installers. The job still fails afterwards
  # so the incomplete release is visible.
  attach-to-release:
    if: ${{ !cancelled() && github.event_name == 'release' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: falkordb-browser-desktop-*
          path: installers
          merge-multiple: true

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop installers were built."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Fail when a platform build failed
        if: ${{ needs.build.result != 'success' }}
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "::error::Desktop build result was '$BUILD_RESULT'; installers for the failed platforms were not attached."
          exit 1
